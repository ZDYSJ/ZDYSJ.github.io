<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账单艺术家</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- 密码验证层 -->
    <div id="password-layer">
        <div class="password-box">
            <h2 class="password-title">🔐 请输入访问密码</h2>
            <div class="input-wrapper">
                <input type="password" id="password-input" placeholder="输入密码">
                <i class="fas fa-check success-check"></i>
            </div>
            <button onclick="verifyPassword()" class="verify-btn">验证</button>
        </div>
    </div>

    <!-- 主内容 -->
    <div id="main-content">
        <div class="button-container">
            <button id="convert-btn"><i class="fas fa-exchange-alt"></i></button>
            <button id="upload-btn">+</button>
            <input type="file" id="file-input">
        </div>
        
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        
        <div id="table-container">
            <table id="result-table">
                <thead></thead>
                <tbody id="result-body"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
