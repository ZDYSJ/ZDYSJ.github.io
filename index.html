<!-- index.html -->
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能账单管理系统</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- 密码验证层 -->
    <div id="password-layer">
        <div class="password-box">
            <h2 class="password-title">🔐 访问认证</h2>
            <div class="input-wrapper">
                <input type="password" id="password-input" placeholder="输入访问密码">
                <i class="fas fa-check success-check"></i>
            </div>
            <button onclick="verifyPassword()" class="verify-btn">提交验证</button>
        </div>
    </div>

    <!-- 主功能界面 -->
    <div id="main-content" style="display:none;">
        <!-- 功能按钮 -->
        <div id="floating-buttons">
            <div class="button-container">
                <button id="convert-btn"><i class="fas fa-exchange-alt"></i></button>
                <button id="upload-btn">+</button>
            </div>
        </div>
        
        <!-- 文件上传 -->
        <input type="file" id="file-input" accept=".xlsx, .xls">
        
        <!-- 进度条 -->
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        
        <!-- 数据表格 -->
        <div id="table-container">
            <table id="result-table">
                <thead></thead>
                <tbody id="result-body"></tbody>
            </table>
        </div>
    </div>

    <!-- 第三方库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <!-- 主逻辑 -->
    <script src="script.js"></script>
</body>
</html>
