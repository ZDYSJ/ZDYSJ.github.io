<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账艺</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
  <!-- 密码验证层 -->
  <div id="password-layer">
    <div class="password-box">
      <h2 class="password-title">账艺</h2>
      <div class="input-wrapper">
        <input type="text" id="username-input" placeholder="请输入账号">
      </div>
      <div class="input-wrapper">
        <input type="password" id="password-input" placeholder="请输入密钥">
      </div>
      <!-- 错误提示区域 -->
      <div id="error-message" class="error-message"></div>
      <button id="verify-btn" onclick="verifyPassword()" class="verify-btn">验证密钥</button>
    </div>
  </div>

  <!-- 主功能界面 -->
  <div id="main-content" style="display:none;">
    <div id="quota-display">剩余次数：0</div>
    
    <!-- 浮动按钮区域 -->
    <div id="floating-buttons">
      <div class="button-container">
        <button id="convert-btn"><i class="fas fa-exchange-alt"></i></button>
        <button id="upload-btn">+</button>
      </div>
    </div>
    
    <input type="file" id="file-input" accept=".xlsx, .xls" style="display:none;">
    
    <!-- 屏幕中间的进度条 -->
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    
    <!-- 表格区域（已取消蒙版效果） -->
    <div id="table-container">
      <table id="result-table">
        <thead>
          <tr>
            <th>交易类型</th>
            <th>收/支</th>
            <th>交易方式</th>
            <th>金额</th>
            <th>交易对方</th>
            <th>次数</th>
            <th>详情</th>
          </tr>
        </thead>
        <tbody id="result-body"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
