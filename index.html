<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>账艺</title>

  <!-- 样式 & 图标 -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <!-- 哈希 & Excel 解析 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- 密码验证层 -->
  <div id="password-layer">
    <div class="password-box">
      <h2 class="password-title">账艺</h2>
      <div class="input-wrapper">
        <input type="text" id="username-input" placeholder="请输入账号" />
      </div>
      <div class="input-wrapper">
        <input type="password" id="password-input" placeholder="请输入密钥" />
      </div>
      <div id="error-message" class="error-message"></div>
      <button id="verify-btn" class="verify-btn">验证密钥</button>
    </div>
  </div>

  <!-- 主功能界面 -->
  <div id="main-content" style="display:none;">
    <!-- VIP 铭牌 -->
    <div id="vip-badge">VIP <span id="vip-username"></span></div>
    <!-- 更多分析 下拉菜单 -->
    <div id="analysis-dropdown">
      <button id="dropdown-btn">
        更多分析 <i class="fas fa-chevron-down"></i>
      </button>
      <div id="dropdown-menu">
        <!-- 用户基本信息 -->
        <div class="dropdown-item" id="info-name"></div>
        <div class="dropdown-item" id="info-wechat"></div>
        <div class="dropdown-item" id="info-id"></div>
        <!-- 统计饼图 -->
        <canvas id="stats-chart" width="180" height="180"></canvas>
        <div id="stats-details">
          <div class="detail-item">收入：<span id="stat-income">0.00</span></div>
          <div class="detail-item">支出：<span id="stat-expense">0.00</span></div>
          <div class="detail-item">其他：<span id="stat-other">0.00</span></div>
        </div>
        <div id="stats-extra">
          <div class="detail-item">最高单笔收入：<span id="max-income">0.00</span></div>
          <div class="detail-item">最高单笔支出：<span id="max-expense">0.00</span></div>
        </div>
      </div>
    </div>
    <!-- 剩余次数 -->
    <div id="quota-display">剩余次数：0</div>

    <!-- 上传 & 转换 按钮 -->
    <div id="floating-buttons">
      <div class="button-container">
        <button id="convert-btn"><i class="fas fa-exchange-alt"></i></button>
        <button id="upload-btn">+</button>
      </div>
    </div>
    <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none;" />

    <!-- 进度条 -->
    <div id="progress-container"><div id="progress-bar"></div></div>

    <!-- 交易表格区域 -->
    <div id="table-container">
      <!-- 文件 B3 日期/时间 -->
      <div id="file-date" class="file-date"></div>
      <!-- 结果表格 -->
      <table id="result-table">
        <thead>
          <tr>
            <th>交易类型</th>
            <th>收/支</th>
            <th>交易方式</th>
            <th>金额</th>
            <th>交易对方</th>
            <th>次数</th>
            <th>详情</th>
          </tr>
        </thead>
        <tbody id="result-body"></tbody>
      </table>
    </div>
  </div>

  <!-- 核心脚本 -->
  <script src="script.js"></script>
</body>
</html>
