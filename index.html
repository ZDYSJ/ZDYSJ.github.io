<!-- index.html -->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>账艺</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- 登录层 -->
  <div id="password-layer">
    <div class="password-box">
      <h2 class="password-title">账艺</h2>
      <div class="input-wrapper">
        <input type="text" id="username-input" placeholder="请输入账号" />
      </div>
      <div class="input-wrapper">
        <input type="password" id="password-input" placeholder="请输入密钥" />
      </div>
      <button id="verify-btn" class="verify-btn">
        <span class="btn-text">验证密钥</span>
        <span class="tick-mark">
          <svg viewBox="0 0 52 52"><path d="M14 27 l10 10 l20 -20"></path></svg>
        </span>
      </button>
    </div>
  </div>

  <!-- 主内容 -->
  <div id="main-content" style="display:none;">
    <!-- 右上角：VIP + 剩余 -->
    <div id="vip-badge">
      VIP <span id="vip-username"></span>
      <span id="quota-display">剩余：0</span>
    </div>

    <!-- 左上角：更多分析 -->
    <div class="header-controls">
      <div id="analysis-dropdown" class="dropdown-container">
        <button id="dropdown-btn" class="dropdown-toggle">
          更多分析 <i class="fas fa-chevron-down"></i>
        </button>
        <div id="dropdown-menu" class="dropdown-menu">
          <div class="dropdown-item" id="info-name"></div>
          <div class="dropdown-item" id="info-wechat"></div>
          <div class="dropdown-item" id="info-id"></div>
          <canvas id="stats-chart" width="140" height="140"></canvas>
          <div id="stats-details">
            <div class="detail-item"><span class="dot income-dot"></span>收入：<span id="stat-income">0.00</span></div>
            <div class="detail-item"><span class="dot expense-dot"></span>支出：<span id="stat-expense">0.00</span></div>
            <div class="detail-item"><span class="dot other-dot"></span>其他：<span id="stat-other">0.00</span></div>
          </div>
          <div id="stats-extra">
            <div class="detail-item">最高单笔收入：<span id="max-income">0.00</span></div>
            <div class="detail-item">最高单笔支出：<span id="max-expense">0.00</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部按钮：转换 / 上传 / 筛选 -->
    <div id="floating-buttons">
      <div class="button-container">
        <button id="convert-btn"><i class="fas fa-exchange-alt"></i></button>
        <button id="upload-btn"><i class="fas fa-upload"></i></button>
        <div id="filter-container">
          <button id="filter-button" class="filter-btn"><i class="fas fa-filter"></i></button>
          <div id="filter-drawer" class="filter-drawer">
            <button class="drawer-option" data-action="all">全部</button>
            <button class="drawer-option" data-action="amount" data-value="100">100元以上</button>
            <button class="drawer-option" data-action="amount" data-value="300">300元以上</button>
            <button class="drawer-option" data-action="amount" data-value="500">500元以上</button>
            <button class="drawer-option" data-action="expense">只看支出</button>
            <button class="drawer-option" data-action="income">只看收入</button>
            <div class="drawer-custom">
              <input type="number" id="drawer-custom-input" placeholder="自定义金额" />
              <span>元以上</span>
              <button id="drawer-custom-confirm">确认</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none;" />
    <div id="progress-container"><div id="progress-bar"></div></div>

    <!-- 表格区域 -->
    <div id="table-container">
      <div id="file-date" class="file-date"></div>
      <table id="result-table">
        <thead>
          <tr>
            <th>交易类型</th>
            <th>收/支</th>
            <th>交易方式</th>
            <th>金额</th>
            <th>交易对方</th>
            <th>次数</th>
            <th>详情</th>
          </tr>
        </thead>
        <tbody id="result-body"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
